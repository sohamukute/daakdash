name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - auth
          - gateway
          - tracking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: build and test
        run: mvn -B -f ${{ matrix.module }}/pom.xml verify
      - name: upload coverage
        if: (matrix.module == 'auth' || matrix.module == 'tracking') && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.module }}/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.module }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
