server:
  port: 8081

spring:
  application:
    name: auth
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/auth}
    username: ${DB_USER:daakdash}
    password: ${DB_PASSWORD:daakdash}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-with-env-var-min-32-bytes}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 1209600

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
