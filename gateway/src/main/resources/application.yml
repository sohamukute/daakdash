server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
        - id: parcels
          uri: http://tracking:8082
          predicates:
            - Path=/api/parcels/**
        - id: depot
          uri: http://tracking:8082
          predicates:
            - Path=/api/depot/**
        - id: depots
          uri: http://tracking:8082
          predicates:
            - Path=/api/depots/**
        - id: partner
          uri: http://tracking:8082
          predicates:
            - Path=/api/partner/**
        - id: admin-sellers
          uri: http://auth:8081
          predicates:
            - Path=/api/admin/sellers
        - id: admin
          uri: http://tracking:8082
          predicates:
            - Path=/api/admin/**
        - id: track
          uri: http://tracking:8082
          predicates:
            - Path=/api/track/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-with-env-var-min-32-bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
