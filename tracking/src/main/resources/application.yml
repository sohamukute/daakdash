server:
  port: 8082

spring:
  application:
    name: tracking
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/geo}
    username: ${DB_USER:daakdash}
    password: ${DB_PASSWORD:daakdash}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-with-env-var-min-32-bytes}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
